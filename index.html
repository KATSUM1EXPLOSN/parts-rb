<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PartsRB 🇧🇾 — Умный подбор запчастей</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
    }
    body.tg-mode {
      background-color: var(--tg-theme-bg-color, var(--bg-color));
      color: var(--tg-theme-text-color, var(--text-color));
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased flex flex-col items-center">

  <div class="w-full max-w-md min-h-screen flex flex-col bg-white shadow-xl relative border-x border-slate-100">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-100 px-4 py-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-lg shadow-md text-white font-bold">
            ⚡
          </div>
          <div>
            <h1 class="text-base font-bold leading-tight flex items-center gap-1.5">
              <span>PartsRB Pro</span>
              <span class="text-[9px] bg-red-100 text-red-700 font-bold px-1.5 py-0.5 rounded">РБ 🇧🇾</span>
            </h1>
            <p class="text-[11px] text-slate-500 flex items-center gap-1">
              <span id="backendStatusDot" class="w-2 h-2 rounded-full bg-amber-400 inline-block animate-pulse"></span>
              <span id="backendStatusText">Проверка сервера...</span>
            </p>
          </div>
        </div>

        <button id="currencyBtn" onclick="toggleCurrency()" class="px-2.5 py-1 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors flex items-center gap-1">
          <span>BYN</span> 🇧🇾
        </button>
      </div>

      <!-- Умный поиск (Live Bar) -->
      <div class="mt-3 relative">
        <input 
          type="text" 
          id="smartSearchInput" 
          oninput="onSmartSearch(this.value)" 
          placeholder="🔎 Умный поиск: 'Пассат б6 бампер' или '1.9 tdi'..." 
          class="w-full px-3.5 py-2 pl-9 bg-slate-100 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium"
        />
        <span class="absolute left-3 top-2.5 text-xs text-slate-400">✨</span>
        <div id="smartResultsBox" class="absolute left-0 right-0 top-10 bg-white border border-slate-200 rounded-xl shadow-xl z-50 hidden max-h-56 overflow-y-auto"></div>
      </div>
    </header>

    <main class="p-4 flex-1 space-y-4">

      <!-- Гараж -->
      <div id="garageSection" class="bg-gradient-to-r from-blue-50/70 to-indigo-50/50 rounded-2xl p-3 border border-blue-100">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <span>🧰</span> Мой гараж
          </span>
          <span class="text-[10px] text-slate-400">быстрый выбор</span>
        </div>
        <div id="garageList" class="flex gap-2 overflow-x-auto hide-scrollbar pb-1"></div>
      </div>

      <!-- Основная карточка параметров авто -->
      <div class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm space-y-3">
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[11px] font-semibold text-slate-600 mb-1 block">Марка</label>
            <select id="brandSelect" onchange="onBrandChange()" class="w-full px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Выберите марку...</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] font-semibold text-slate-600 mb-1 block">Модель</label>
            <select id="modelSelect" onchange="onModelChange()" disabled class="w-full px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 disabled:opacity-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Сначала марка</option>
            </select>
          </div>
        </div>

        <!-- Код двигателя / Модификация -->
        <div>
          <label class="text-[11px] font-semibold text-slate-600 mb-1 flex items-center justify-between">
            <span>Двигатель / Модификация</span>
            <span class="text-[10px] text-blue-600 font-normal">для навесного и ТО</span>
          </label>
          <select id="engineSelect" disabled class="w-full px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 disabled:opacity-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Выберите двигатель...</option>
          </select>
        </div>

        <!-- Поле детали и найденный OEM -->
        <div class="space-y-1.5 pt-1">
          <label class="text-xs font-semibold text-slate-700 flex items-center justify-between">
            <span>⚙️ Название детали</span>
            <span id="detectedOemBadge" class="hidden text-[10px] bg-emerald-100 text-emerald-800 font-mono px-1.5 py-0.5 rounded">OEM</span>
          </label>
          <input 
            type="text" 
            id="partInput" 
            oninput="checkPartForCrosses(this.value)"
            placeholder="Фара, бампер, колодки, генератор..." 
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium"
          />

          <!-- Блок кросс-замен (TecDoc) -->
          <div id="crossesBox" class="hidden p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-[11px] space-y-1">
            <span class="font-semibold text-slate-700 block">Кросс-замены (TecDoc аналоги):</span>
            <div id="crossesList" class="flex flex-wrap gap-1"></div>
          </div>

          <!-- Быстрые теги -->
          <div class="flex items-center gap-1.5 overflow-x-auto hide-scrollbar pt-1">
            <button onclick="setPartTag('Бампер')" class="shrink-0 text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">🛡️ Бампер</button>
            <button onclick="setPartTag('Фара')" class="shrink-0 text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">💡 Фара</button>
            <button onclick="setPartTag('Колодки')" class="shrink-0 text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">🛑 Колодки</button>
            <button onclick="setPartTag('Генератор')" class="shrink-0 text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">⚡ Генератор</button>
          </div>
        </div>

        <!-- Фильтры -->
        <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-100">
          <div>
            <label class="text-[11px] font-semibold text-slate-500 mb-1 block">Город в РБ</label>
            <select id="citySelect" class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-800">
              <option value="all">🇧🇾 Вся Беларусь</option>
              <option value="minsk" selected>🏙️ Минск и обл.</option>
              <option value="grodno">🏰 Гродно</option>
              <option value="brest">⭐ Брест</option>
              <option value="gomel">🌲 Гомель</option>
              <option value="vitebsk">🎨 Витебск</option>
              <option value="mogilev">🦁 Могилев</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] font-semibold text-slate-500 mb-1 block">Состояние</label>
            <select id="conditionSelect" class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-800">
              <option value="all" selected>🔄 Все</option>
              <option value="used">♻️ Только Б/У</option>
              <option value="new">✨ Только Новые</option>
            </select>
          </div>
        </div>

        <button 
          onclick="executeSearch()" 
          class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold text-sm rounded-xl shadow-md shadow-blue-500/25 flex items-center justify-center gap-2 transition-all"
        >
          <span>🚀</span>
          <span>Найти реальные предложения в РБ</span>
        </button>

      </div>

      <!-- Результаты -->
      <div class="flex items-center justify-between pt-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1" id="resultsTitle">
          <span>📋</span> Выдача по разборкам и базам РБ
        </h2>
        <span id="resultsCountBadge" class="text-xs bg-slate-200 text-slate-700 font-semibold px-2 py-0.5 rounded-full">
          Готово
        </span>
      </div>

      <div id="resultsList" class="space-y-2.5">
        <div class="text-center py-8 px-4 bg-white rounded-2xl border border-slate-200/80 text-xs text-slate-500 space-y-2">
          <div class="text-2xl">🔎</div>
          <p>Выберите автомобиль и деталь для подбора</p>
        </div>
      </div>

    </main>

    <!-- Нижняя панель -->
    <div class="sticky bottom-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-2.5 flex items-center gap-2">
      <button onclick="shareResults()" class="flex-1 py-2.5 bg-slate-900 hover:bg-black text-white text-xs font-semibold rounded-xl flex items-center justify-center gap-1.5 shadow">
        <span>✈️</span> Отправить выборку в Telegram
      </button>
      <button onclick="resetFilters()" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl" title="Сбросить">
        <span>🔄</span>
      </button>
    </div>

    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs px-4 py-2 rounded-xl shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none flex items-center gap-1.5">
      <span>🔔</span> <span id="toastText">Сообщение</span>
    </div>

  </div>

  <script>
    const API_BASE_URL = "https://parts-rb-1.onrender.com";

    // Встроенная база для РБ: Geely/Belgee, VAG, Renault, Audi, BMW + моторы + кроссы
    const DEFAULT_CARS = [
      {
        brand: "Geely / Belgee",
        model: "Coolray / X50",
        years: "2020-2024",
        engines: ["1.5T JLH-3G15TD (177 л.с.)", "1.5 BHE15-EFZ"],
        parts: {
          "фара": { oem: "4017042500", crosses: ["ST-40170425", "PATRON PH098"] },
          "бампер": { oem: "6017032100", crosses: ["ST-60170321"] },
          "колодки": { oem: "4048039200", crosses: ["Brembo P50098", "Stellox 000-421B-SX"] }
        }
      },
      {
        brand: "Volkswagen",
        model: "Passat B6",
        years: "2005-2010",
        engines: ["1.9 TDI BKC/BXE (105 л.с.)", "2.0 TDI BMP/BMM (140 л.с.)", "1.8 TSI BZB/CDAA"],
        parts: {
          "фара": { oem: "3C0941005AA", crosses: ["Depo 441-1159L", "Hella 1EL 009 144"] },
          "бампер": { oem: "3C0807217D", crosses: ["Polcar 955307-1", "Phira B0410"] },
          "колодки": { oem: "1K0698151", crosses: ["Brembo P 85 072", "TRW GDB1550", "Patron PBP1550"] },
          "генератор": { oem: "06F903023F", crosses: ["Bosch 0 986 048 310", "AS-PL A0254"] }
        }
      },
      {
        brand: "Volkswagen",
        model: "Passat B7",
        years: "2010-2015",
        engines: ["2.0 TDI CFFB (140 л.с.)", "1.4 TSI CAXA", "1.8 TSI CDAA"],
        parts: {
          "фара": { oem: "3AA941005", crosses: ["Valeo 044685", "Depo 441-11B5L"] },
          "колодки": { oem: "1K0698151E", crosses: ["TRW GDB1550", "Ferodo FDB1641"] }
        }
      },
      {
        brand: "Renault",
        model: "Megane 3",
        years: "2008-2016",
        engines: ["1.5 dCi K9K (86/106/110 л.с.)", "1.6 K4M (110 л.с.)"],
        parts: {
          "фара": { oem: "260600024R", crosses: ["Depo 551-1178L", "Valeo 043967"] },
          "бампер": { oem: "620220025R", crosses: ["Polcar 601307"] },
          "колодки": { oem: "410602192R", crosses: ["Remsa 1204.00", "Stellox 000-098B-SX"] }
        }
      },
      {
        brand: "Audi",
        model: "A6 C6",
        years: "2004-2011",
        engines: ["2.0 TDI BRE/CAGB", "2.7 TDI BPP", "3.0 TDI ASB/CDYA"],
        parts: {
          "фара": { oem: "4F0941003", crosses: ["Hella 1EL 247 014-011"] },
          "бампер": { oem: "4F0807105GRU", crosses: ["Polcar 133807"] },
          "колодки": { oem: "4F0698151D", crosses: ["Brembo P 85 076", "TRW GDB1622"] }
        }
      },
      {
        brand: "BMW",
        model: "5-Series (E60)",
        years: "2003-2010",
        engines: ["2.5d / 3.0d M57", "2.5i / 3.0i M54/N52"],
        parts: {
          "фара": { oem: "63127160149", crosses: ["Hella 1LL 008 676-011"] },
          "колодки": { oem: "34116763617", crosses: ["Ate 13.0460-7174.2", "Textar 2379401"] }
        }
      }
    ];

    let dbCars = DEFAULT_CARS;
    let currentCurrency = 'BYN';
    const BYN_PER_USD = 3.28;
    let selectedOem = null;
    let lastQueryInfo = null;

    window.addEventListener('DOMContentLoaded', async () => {
      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        document.body.classList.add('tg-mode');
      }

      // Попытка загрузить внешний cars_db.json, если есть
      try {
        const res = await fetch('cars_db.json');
        if (res.ok) {
          const data = await res.json();
          if (data.cars && data.cars.length > 0) dbCars = data.cars;
        }
      } catch (e) {}

      populateBrandSelect();
      renderGarage();
      pingBackend();
    });

    function populateBrandSelect() {
      const brandSel = document.getElementById('brandSelect');
      brandSel.innerHTML = '<option value="">Выберите марку...</option>';
      const brands = [...new Set(dbCars.map(c => c.brand))];
      brands.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = `🚗 ${b}`;
        brandSel.appendChild(opt);
      });
    }

    function onBrandChange() {
      const brand = document.getElementById('brandSelect').value;
      const modelSelect = document.getElementById('modelSelect');
      const engineSelect = document.getElementById('engineSelect');

      modelSelect.innerHTML = '<option value="">Выберите модель...</option>';
      engineSelect.innerHTML = '<option value="">Сначала модель</option>';
      engineSelect.disabled = true;

      const models = dbCars.filter(c => c.brand === brand);
      if (models.length > 0) {
        modelSelect.disabled = false;
        models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.model;
          opt.textContent = `${m.model} (${m.years})`;
          modelSelect.appendChild(opt);
        });
      } else {
        modelSelect.disabled = true;
      }
    }

    function onModelChange() {
      const brand = document.getElementById('brandSelect').value;
      const modelName = document.getElementById('modelSelect').value;
      const engineSelect = document.getElementById('engineSelect');

      engineSelect.innerHTML = '<option value="">Все двигатели</option>';
      const car = dbCars.find(c => c.brand === brand && c.model === modelName);

      if (car && car.engines) {
        engineSelect.disabled = false;
        car.engines.forEach(eng => {
          const opt = document.createElement('option');
          opt.value = eng;
          opt.textContent = `⚙️ ${eng}`;
          engineSelect.appendChild(opt);
        });
      } else {
        engineSelect.disabled = true;
      }

      checkPartForCrosses(document.getElementById('partInput').value);
    }

    // Умный поиск (разбирает марку, модель и деталь)
    function onSmartSearch(text) {
      const box = document.getElementById('smartResultsBox');
      const val = text.trim().toLowerCase();
      if (val.length < 2) {
        box.classList.add('hidden');
        return;
      }

      const matches = [];
      dbCars.forEach(car => {
        const full = `${car.brand} ${car.model}`.toLowerCase();
        if (full.includes(val) || val.includes(car.model.toLowerCase())) {
          matches.push(car);
        }
      });

      if (matches.length === 0) {
        box.classList.add('hidden');
        return;
      }

      box.classList.remove('hidden');
      box.innerHTML = matches.slice(0, 5).map(c => `
        <div onclick="selectSmartCar('${c.brand}', '${c.model}')" class="p-2.5 hover:bg-slate-50 cursor-pointer border-b border-slate-100 last:border-none flex items-center justify-between">
          <div>
            <div class="text-xs font-semibold text-slate-800">${c.brand} ${c.model}</div>
            <div class="text-[10px] text-slate-400">${c.years} • ${c.engines ? c.engines[0] : ''}</div>
          </div>
          <span class="text-blue-600 text-xs font-semibold">Выбрать &rarr;</span>
        </div>
      `).join('');
    }

    function selectSmartCar(brand, model) {
      document.getElementById('brandSelect').value = brand;
      onBrandChange();
      document.getElementById('modelSelect').value = model;
      onModelChange();
      document.getElementById('smartResultsBox').classList.add('hidden');
      document.getElementById('smartSearchInput').value = '';
      showToast(`Выбрано: ${brand} ${model}`);
    }

    // Проверка детали на TecDoc кроссы и OEM
    function checkPartForCrosses(partText) {
      const brand = document.getElementById('brandSelect').value;
      const model = document.getElementById('modelSelect').value;
      const oemBadge = document.getElementById('detectedOemBadge');
      const crossesBox = document.getElementById('crossesBox');
      const crossesList = document.getElementById('crossesList');

      selectedOem = null;
      if (!brand || !model || !partText) {
        oemBadge.classList.add('hidden');
        crossesBox.classList.add('hidden');
        return;
      }

      const car = dbCars.find(c => c.brand === brand && c.model === model);
      if (!car || !car.parts) return;

      const pLower = partText.toLowerCase();
      let hitKey = Object.keys(car.parts).find(k => pLower.includes(k));

      if (hitKey) {
        const pInfo = car.parts[hitKey];
        selectedOem = pInfo.oem;
        oemBadge.textContent = `OEM: ${pInfo.oem}`;
        oemBadge.classList.remove('hidden');

        if (pInfo.crosses && pInfo.crosses.length > 0) {
          crossesBox.classList.remove('hidden');
          crossesList.innerHTML = pInfo.crosses.map(cr => `
            <span class="px-2 py-0.5 bg-blue-100 text-blue-800 rounded font-mono text-[10px]">${cr}</span>
          `).join('');
        }
      } else {
        oemBadge.classList.add('hidden');
        crossesBox.classList.add('hidden');
      }
    }

    function setPartTag(tag) {
      document.getElementById('partInput').value = tag;
      checkPartForCrosses(tag);
    }

    // Транслитерация для Bamper.by
    function makeSlug(text) {
      const ru = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ы':'y','э':'e','ю':'yu','я':'ya',' ':'-'};
      return text.toLowerCase().split('').map(c => ru[c] || (/[a-z0-9]/.test(c) ? c : '-')).join('').replace(/-+/g, '-').replace(/^-|-$/g, '');
    }

    // Запуск реального поиска
    async function executeSearch() {
      const part = document.getElementById('partInput').value.trim();
      const brand = document.getElementById('brandSelect').value;
      const model = document.getElementById('modelSelect').value;
      const engine = document.getElementById('engineSelect').value;
      const city = document.getElementById('citySelect').value;
      const cond = document.getElementById('conditionSelect').value;

      if (!part) return showToast("⚠️ Укажите запчасть");
      if (!brand || !model) return showToast("⚠️ Выберите марку и модель авто");

      const carLabel = `${brand} ${model}`;
      lastQueryInfo = { carLabel, part, engine, oem: selectedOem, city, cond };

      const container = document.getElementById('resultsList');
      container.innerHTML = `
        <div class="text-center py-6 text-xs text-blue-600 space-y-2">
          <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-blue-600 border-t-transparent"></div>
          <p>⏳ Опрашиваем Kufar API и склады РБ...</p>
        </div>
      `;

      try {
        const resp = await fetch(`${API_BASE_URL}/api/search`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            car: carLabel,
            part: part,
            engine: engine || null,
            city: city,
            condition: cond
          })
        });

        if (resp.ok) {
          const liveData = await resp.json();
          renderCards(liveData);
          showToast("✅ Реальные данные загружены!");
          return;
        }
      } catch (e) {
        console.warn("API Error:", e);
      }

      // Если бэкенд спит — показываем точные ссылки
      renderFallback(carLabel, part, engine, cond);
    }

    function renderCards(items) {
      const container = document.getElementById('resultsList');
      document.getElementById('resultsCountBadge').textContent = `Найдено: ${items.length} 🎯`;

      if (!items || items.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Ничего не найдено</div>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="bg-white rounded-2xl border border-slate-200/90 p-3 shadow-sm flex gap-3 items-center">
          ${item.imageUrl ? `<img src="${item.imageUrl}" class="w-16 h-16 rounded-xl object-cover bg-slate-100 shrink-0" alt="part">` : ''}
          <div class="flex-1 min-w-0 space-y-1">
            <div class="flex items-start justify-between gap-1">
              <span class="text-[9px] font-bold px-1.5 py-0.2 rounded ${item.condition === 'Б/У' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">
                ${item.condition}
              </span>
              <span class="price-tag text-xs font-bold text-slate-900" data-byn="${item.priceByn}">${item.priceByn} BYN</span>
            </div>
            <h3 class="text-xs font-semibold text-slate-800 leading-tight truncate">${item.title}</h3>
            <p class="text-[10px] text-slate-400 truncate">${item.source} • ${item.city}</p>
            <div class="pt-1 flex justify-end">
              <a href="${item.sourceUrl}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 text-white font-medium text-[11px] rounded-lg">
                Открыть ↗
              </a>
            </div>
          </div>
        </div>
      `).join('');
      updateRenderedPrices();
    }

    function renderFallback(carLabel, part, engine, cond) {
      const fullQ = encodeURIComponent(`${carLabel} ${part}`);
      const partSlug = makeSlug(part);

      const items = [
        {
          title: `Kufar Авто: ${part} (${carLabel})`,
          car: carLabel,
          condition: "Б/У",
          source: "Kufar.by",
          sourceUrl: `https://auto.kufar.by/l/avtotovary/zapchasti?query=${fullQ}`,
          city: "Вся Беларусь",
          priceByn: 110.0
        },
        {
          title: `Разборки Bamper.by: ${part}`,
          car: carLabel,
          condition: "Б/У",
          source: "Bamper.by",
          sourceUrl: `https://bamper.by/search/zapchast_${partSlug}/`,
          city: "Минск / Разборки",
          priceByn: 140.0
        },
        {
          title: `Каталог av.by: ${part}`,
          car: carLabel,
          condition: "Б/У",
          source: "av.by Запчасти",
          sourceUrl: `https://zapchasti.av.by/search?query=${fullQ}`,
          city: "РБ",
          priceByn: 125.0
        },
        {
          title: `Склад Motorland (гарантия): ${part}`,
          car: carLabel,
          condition: "Б/У",
          source: "Motorland.by",
          sourceUrl: `https://motorland.by/auto-parts/?search_string=${fullQ}`,
          city: "Минск (Колядичи)",
          priceByn: 160.0
        }
      ];

      renderCards(items);
      showToast("⚠️ Точные поисковые ссылки сформированы!");
    }

    function toggleCurrency() {
      currentCurrency = currentCurrency === 'BYN' ? 'USD' : 'BYN';
      document.getElementById('currencyBtn').innerHTML = currentCurrency === 'BYN' ? '<span>BYN</span> 🇧🇾' : '<span>USD</span> 💵';
      updateRenderedPrices();
      showToast(`Валюта: ${currentCurrency}`);
    }

    function updateRenderedPrices() {
      document.querySelectorAll('.price-tag').forEach(el => {
        const byn = parseFloat(el.getAttribute('data-byn'));
        if (!isNaN(byn)) {
          el.textContent = currentCurrency === 'BYN' ? `${byn} BYN` : `$${Math.round(byn / BYN_PER_USD)}`;
        }
      });
    }

    async function pingBackend() {
      const dot = document.getElementById('backendStatusDot');
      const text = document.getElementById('backendStatusText');
      try {
        const res = await fetch(`${API_BASE_URL}/ping`);
        if (res.ok) {
          dot.className = "w-2 h-2 rounded-full bg-emerald-500 inline-block";
          text.textContent = "Сервер онлайн 🟢";
        }
      } catch (e) {
        dot.className = "w-2 h-2 rounded-full bg-amber-400 inline-block animate-pulse";
        text.textContent = "Сервер просыпается ⏳";
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2400);
    }

    function renderGarage() {
      const garage = JSON.parse(localStorage.getItem('partsrb_garage') || '[]');
      const container = document.getElementById('garageList');
      if (garage.length === 0) {
        container.innerHTML = `<span class="text-[11px] text-slate-400 italic">Гараж пуст</span>`;
        return;
      }
      container.innerHTML = garage.map(c => `
        <button onclick="selectSmartCar('${c.brand}', '${c.model}')" class="shrink-0 text-left px-2.5 py-1.5 bg-white border border-slate-200 rounded-xl shadow-xs">
          <div class="text-xs font-semibold text-slate-800">🚘 ${c.brand} ${c.model}</div>
        </button>
      `).join('');
    }

    function shareResults() {
      if (!lastQueryInfo) return showToast("⚠️ Сначала выполните поиск");
      const text = `🔍 Деталь: ${lastQueryInfo.part} на ${lastQueryInfo.carLabel} (OEM: ${lastQueryInfo.oem || 'н/д'})\nСсылка: ${window.location.href}`;
      if (window.Telegram?.WebApp?.sendData) {
        window.Telegram.WebApp.sendData(JSON.stringify(lastQueryInfo));
        return;
      }
      window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`, '_blank');
    }

    function resetFilters() {
      document.getElementById('partInput').value = '';
      document.getElementById('detectedOemBadge').classList.add('hidden');
      document.getElementById('crossesBox').classList.add('hidden');
      document.getElementById('resultsList').innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Форма сброшена</div>`;
      showToast("Сброшено");
    }
  </script>
</body>
</html>
