<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PartsRB 🇧🇾 — Мировой каталог и поиск запчастей</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
    }
    body.tg-mode {
      background-color: var(--tg-theme-bg-color, var(--bg-color));
      color: var(--tg-theme-text-color, var(--text-color));
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased flex flex-col items-center">

  <div class="w-full max-w-md min-h-screen flex flex-col bg-white shadow-xl relative border-x border-slate-100">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-100 px-4 py-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-lg shadow-md text-white font-bold">
            ⚡
          </div>
          <div>
            <h1 class="text-base font-bold leading-tight flex items-center gap-1.5">
              <span>PartsRB Live</span>
              <span class="text-[9px] bg-red-100 text-red-700 font-bold px-1.5 py-0.5 rounded">РБ 🇧🇾</span>
            </h1>
            <p class="text-[11px] text-slate-500 flex items-center gap-1">
              <span id="backendStatusDot" class="w-2 h-2 rounded-full bg-amber-400 inline-block animate-pulse"></span>
              <span id="backendStatusText">Проверка сервера...</span>
            </p>
          </div>
        </div>

        <button id="currencyBtn" onclick="toggleCurrency()" class="px-2.5 py-1 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors flex items-center gap-1">
          <span>BYN</span> 🇧🇾
        </button>
      </div>

      <!-- Вкладки: По VIN или по Каталогу -->
      <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl mt-3 text-xs font-medium text-slate-600">
        <button id="tabVin" onclick="setSearchMode('vin')" class="py-1.5 rounded-lg bg-white text-blue-600 font-semibold shadow-sm transition-all flex items-center justify-center gap-1">
          <span>🔍</span> По VIN-коду
        </button>
        <button id="tabManual" onclick="setSearchMode('manual')" class="py-1.5 rounded-lg text-slate-600 transition-all flex items-center justify-center gap-1">
          <span>🌍</span> Все авто мира
        </button>
      </div>
    </header>

    <main class="p-4 flex-1 space-y-4">

      <!-- Форма подбора -->
      <div class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm space-y-3.5">
        
        <!-- Секция VIN (Реальный декодер) -->
        <div id="vinSection" class="space-y-1.5">
          <div class="flex justify-between items-center">
            <label class="text-xs font-semibold text-slate-700">VIN-номер (17 знаков)</label>
            <span id="vinCounter" class="text-[11px] font-mono text-slate-400">0/17</span>
          </div>
          <div class="relative">
            <input 
              type="text" 
              id="vinInput" 
              maxlength="17" 
              placeholder="Введите любой мировой VIN..." 
              oninput="onVinInput(this)"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs uppercase tracking-wider text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
            />
            <button onclick="pasteVin()" class="absolute right-2 top-2 text-[11px] text-blue-600 bg-blue-50 px-2 py-1 rounded-lg">Вставить</button>
          </div>

          <!-- Результат расшифровки VIN -->
          <div id="vinDecodedCard" class="hidden p-2.5 bg-emerald-50 border border-emerald-100 rounded-xl text-xs space-y-0.5 animate-fadeIn">
            <div class="font-bold text-emerald-900 flex items-center justify-between">
              <span id="vinDecodedTitle">Volkswagen Passat</span>
              <span id="vinDecodedYear" class="text-[10px] bg-emerald-200 text-emerald-800 px-1 rounded">2012</span>
            </div>
            <p id="vinDecodedEngine" class="text-[11px] text-emerald-700">2.0L Diesel (Германия)</p>
          </div>
        </div>

        <!-- Секция Мирового каталога (Все марки и динамическая загрузка моделей) -->
        <div id="manualSection" class="hidden space-y-2.5">
          <div>
            <label class="text-xs font-semibold text-slate-700 mb-1 block">Марка автомобиля</label>
            <select id="brandSelect" onchange="loadModelsForBrand()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:ring-2 focus:ring-blue-500">
              <option value="">Выберите марку...</option>
            </select>
          </div>

          <div>
            <label class="text-xs font-semibold text-slate-700 mb-1 flex items-center justify-between">
              <span>Модель</span>
              <span id="modelsLoadingBadge" class="hidden text-[10px] text-blue-600">Загрузка всех моделей...</span>
            </label>
            <select id="modelSelect" disabled class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 disabled:opacity-50 focus:ring-2 focus:ring-blue-500">
              <option value="">Сначала выберите марку</option>
            </select>
          </div>
        </div>

        <!-- Запчасть -->
        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-700">Название запчасти или артикул (OEM)</label>
          <input 
            type="text" 
            id="partInput" 
            placeholder="Фара, бампер, колодки, суппорт..." 
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium"
          />

          <div class="flex items-center gap-1.5 overflow-x-auto hide-scrollbar pt-1">
            <button onclick="setPartTag('Бампер')" class="shrink-0 text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">🛡️ Бампер</button>
            <button onclick="setPartTag('Фара')" class="shrink-0 text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">💡 Фара</button>
            <button onclick="setPartTag('Колодки')" class="shrink-0 text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">🛑 Колодки</button>
            <button onclick="setPartTag('Капот')" class="shrink-0 text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">🚘 Капот</button>
          </div>
        </div>

        <!-- Регион и состояние -->
        <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-100">
          <div>
            <label class="text-[11px] font-semibold text-slate-500 mb-1 block">Город в РБ</label>
            <select id="citySelect" class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-800">
              <option value="all">🇧🇾 Вся Беларусь</option>
              <option value="minsk" selected>🏙️ Минск и обл.</option>
              <option value="grodno">🏰 Гродно</option>
              <option value="brest">⭐ Брест</option>
              <option value="gomel">🌲 Гомель</option>
              <option value="vitebsk">🎨 Витебск</option>
              <option value="mogilev">🦁 Могилев</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] font-semibold text-slate-500 mb-1 block">Состояние</label>
            <select id="conditionSelect" class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-800">
              <option value="all" selected>🔄 Все</option>
              <option value="used">♻️ Только Б/У</option>
              <option value="new">✨ Только Новые</option>
            </select>
          </div>
        </div>

        <button 
          onclick="executeSearch()" 
          class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold text-sm rounded-xl shadow-md shadow-blue-500/25 flex items-center justify-center gap-2 transition-all"
        >
          <span>🚀</span>
          <span>Найти реальные предложения в РБ</span>
        </button>

      </div>

      <!-- Заголовок результатов -->
      <div class="flex items-center justify-between pt-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500" id="resultsTitle">
          Выдача предложений
        </h2>
        <span id="resultsCountBadge" class="text-xs bg-slate-200 text-slate-700 font-semibold px-2 py-0.5 rounded-full">
          Готово
        </span>
      </div>

      <!-- Лента результатов -->
      <div id="resultsList" class="space-y-2.5">
        <div class="text-center py-8 px-4 bg-white rounded-2xl border border-slate-200/80 text-xs text-slate-400">
          Введите VIN или выберите авто для отображения живых предложений
        </div>
      </div>

    </main>

    <!-- Нижняя панель -->
    <div class="sticky bottom-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-2.5 flex items-center gap-2">
      <button onclick="shareResults()" class="flex-1 py-2.5 bg-slate-900 hover:bg-black text-white text-xs font-semibold rounded-xl flex items-center justify-center gap-1.5 shadow">
        <span>✈️</span> Отправить выборку в Telegram
      </button>
      <button onclick="resetFilters()" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl" title="Сбросить">
        <span>🔄</span>
      </button>
    </div>

    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs px-4 py-2 rounded-xl shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none flex items-center gap-1.5">
      <span>🔔</span> <span id="toastText">Сообщение</span>
    </div>

  </div>

  <script>
    const API_BASE_URL = "https://parts-rb-1.onrender.com";
    let currentMode = 'vin';
    let currentCurrency = 'BYN';
    const BYN_PER_USD = 3.28;
    let decodedCar = null;
    let lastQueryInfo = null;

    // Все мировые автопроизводители (официальный реестр)
    const GLOBAL_BRANDS = [
      "Acura", "Alfa Romeo", "Audi", "BMW", "BYD", "Bentley", "Cadillac", "Chery", "Chevrolet",
      "Chrysler", "Citroen", "Dacia", "Daewoo", "Dodge", "FAW", "Fiat", "Ford", "GAC", "Geely",
      "Genesis", "GMC", "Great Wall", "Haval", "Honda", "Hyundai", "Infiniti", "Jaguar", "Jeep",
      "Kia", "Lada", "Land Rover", "Lexus", "Lifan", "Lincoln", "Mazda", "Mercedes-Benz", "Mini",
      "Mitsubishi", "Nissan", "Opel", "Peugeot", "Porsche", "Renault", "Rolls-Royce", "Rover",
      "Saab", "Seat", "Skoda", "Smart", "Subaru", "Suzuki", "Tesla", "Toyota", "Volkswagen", "Volvo", "Zotye"
    ];

    window.addEventListener('DOMContentLoaded', () => {
      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        document.body.classList.add('tg-mode');
      }

      // Заполнение марок
      const brandSel = document.getElementById('brandSelect');
      GLOBAL_BRANDS.sort().forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = b;
        brandSel.appendChild(opt);
      });

      pingBackend();
    });

    function setSearchMode(mode) {
      currentMode = mode;
      document.getElementById('tabVin').className = mode === 'vin'
        ? "py-1.5 rounded-lg bg-white text-blue-600 font-semibold shadow-sm transition-all flex items-center justify-center gap-1"
        : "py-1.5 rounded-lg text-slate-600 transition-all flex items-center justify-center gap-1";

      document.getElementById('tabManual').className = mode === 'manual'
        ? "py-1.5 rounded-lg bg-white text-blue-600 font-semibold shadow-sm transition-all flex items-center justify-center gap-1"
        : "py-1.5 rounded-lg text-slate-600 transition-all flex items-center justify-center gap-1";

      document.getElementById('vinSection').classList.toggle('hidden', mode !== 'vin');
      document.getElementById('manualSection').classList.toggle('hidden', mode !== 'manual');
    }

    // Живая загрузка моделей из NHTSA через бэкенд
    async function loadModelsForBrand() {
      const brand = document.getElementById('brandSelect').value;
      const modelSel = document.getElementById('modelSelect');
      const badge = document.getElementById('modelsLoadingBadge');

      modelSel.innerHTML = '<option value="">Выберите модель...</option>';
      if (!brand) {
        modelSel.disabled = true;
        return;
      }

      badge.classList.remove('hidden');
      modelSel.disabled = true;

      try {
        const res = await fetch(`${API_BASE_URL}/api/models?make=${encodeURIComponent(brand)}`);
        if (res.ok) {
          const data = await res.json();
          if (data.models && data.models.length > 0) {
            data.models.forEach(m => {
              const opt = document.createElement('option');
              opt.value = m;
              opt.textContent = m;
              modelSel.appendChild(opt);
            });
            modelSel.disabled = false;
          }
        }
      } catch (e) {
        console.warn("Ошибка загрузки моделей:", e);
      } finally {
        badge.classList.add('hidden');
      }
    }

    // Живой декодер VIN через бэкенд
    let vinDebounce = null;
    function onVinInput(input) {
      let val = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      input.value = val;
      document.getElementById('vinCounter').textContent = `${val.length}/17`;

      clearTimeout(vinDebounce);
      if (val.length >= 11) {
        vinDebounce = setTimeout(() => requestVinDecode(val), 600);
      } else {
        document.getElementById('vinDecodedCard').classList.add('hidden');
        decodedCar = null;
      }
    }

    async function requestVinDecode(vin) {
      showToast("🔍 Расшифровываем VIN...");
      try {
        const res = await fetch(`${API_BASE_URL}/api/vin-decode?vin=${vin}`);
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            decodedCar = data;
            document.getElementById('vinDecodedTitle').textContent = `${data.make} ${data.model}`;
            document.getElementById('vinDecodedYear').textContent = data.year || 'н/д';
            document.getElementById('vinDecodedEngine').textContent = `${data.engine} (${data.country})`;
            document.getElementById('vinDecodedCard').classList.remove('hidden');
            showToast(`✅ Авто: ${data.make} ${data.model}`);
            return;
          }
        }
      } catch (e) {}
    }

    async function pasteVin() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          const input = document.getElementById('vinInput');
          input.value = text.trim().substring(0, 17);
          onVinInput(input);
        }
      } catch (e) {
        showToast("Введите VIN вручную");
      }
    }

    function setPartTag(tag) {
      document.getElementById('partInput').value = tag;
    }

    // Запуск живого поиска
    async function executeSearch() {
      const part = document.getElementById('partInput').value.trim();
      if (!part) return showToast("⚠️ Укажите запчасть");

      let carLabel = "";
      let engine = "";

      if (currentMode === 'vin') {
        const vin = document.getElementById('vinInput').value.trim();
        if (decodedCar && decodedCar.make) {
          carLabel = `${decodedCar.make} ${decodedCar.model} ${decodedCar.year || ''}`.trim();
          engine = decodedCar.engine;
        } else if (vin) {
          carLabel = `VIN ${vin.slice(0, 8)}`;
        } else {
          return showToast("⚠️ Введите корректный VIN");
        }
      } else {
        const brand = document.getElementById('brandSelect').value;
        const model = document.getElementById('modelSelect').value;
        if (!brand || !model) return showToast("⚠️ Выберите марку и модель");
        carLabel = `${brand} ${model}`;
      }

      const city = document.getElementById('citySelect').value;
      const cond = document.getElementById('conditionSelect').value;
      lastQueryInfo = { carLabel, part, city, cond };

      const container = document.getElementById('resultsList');
      container.innerHTML = `
        <div class="text-center py-6 text-xs text-blue-600 space-y-2">
          <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-blue-600 border-t-transparent"></div>
          <p>⏳ Запрашиваем реальные объявления Kufar и склады РБ...</p>
        </div>
      `;

      try {
        const resp = await fetch(`${API_BASE_URL}/api/search`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            car: carLabel,
            part: part,
            engine: engine,
            city: city,
            condition: cond
          })
        });

        if (resp.ok) {
          const liveData = await resp.json();
          renderCards(liveData);
          showToast("✅ Реальные данные получены!");
          return;
        }
      } catch (e) {
        console.warn("API Error:", e);
      }

      container.innerHTML = `<div class="text-center py-6 text-xs text-red-500">Сервер не ответил. Попробуйте через 15 секунд.</div>`;
    }

    function renderCards(items) {
      const container = document.getElementById('resultsList');
      document.getElementById('resultsCountBadge').textContent = `Найдено: ${items.length} 🎯`;

      if (!items || items.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Ничего не найдено</div>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="bg-white rounded-2xl border border-slate-200/90 p-3 shadow-sm flex gap-3 items-center">
          ${item.imageUrl ? `<img src="${item.imageUrl}" class="w-16 h-16 rounded-xl object-cover bg-slate-100 shrink-0" alt="part">` : ''}
          <div class="flex-1 min-w-0 space-y-1">
            <div class="flex items-start justify-between gap-1">
              <span class="text-[9px] font-bold px-1.5 py-0.2 rounded ${item.condition === 'Б/У' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">
                ${item.condition}
              </span>
              <span class="price-tag text-xs font-bold text-slate-900" data-byn="${item.priceByn}">${item.priceByn} BYN</span>
            </div>
            <h3 class="text-xs font-semibold text-slate-800 leading-tight truncate">${item.title}</h3>
            <p class="text-[10px] text-slate-400 truncate">${item.source} • ${item.city}</p>
            <div class="pt-1 flex justify-end">
              <a href="${item.sourceUrl}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 text-white font-medium text-[11px] rounded-lg">
                Открыть ↗
              </a>
            </div>
          </div>
        </div>
      `).join('');
      updateRenderedPrices();
    }

    function toggleCurrency() {
      currentCurrency = currentCurrency === 'BYN' ? 'USD' : 'BYN';
      document.getElementById('currencyBtn').innerHTML = currentCurrency === 'BYN' ? '<span>BYN</span> 🇧🇾' : '<span>USD</span> 💵';
      updateRenderedPrices();
      showToast(`Валюта: ${currentCurrency}`);
    }

    function updateRenderedPrices() {
      document.querySelectorAll('.price-tag').forEach(el => {
        const byn = parseFloat(el.getAttribute('data-byn'));
        if (!isNaN(byn)) {
          el.textContent = currentCurrency === 'BYN' ? `${byn} BYN` : `$${Math.round(byn / BYN_PER_USD)}`;
        }
      });
    }

    async function pingBackend() {
      const dot = document.getElementById('backendStatusDot');
      const text = document.getElementById('backendStatusText');
      try {
        const res = await fetch(`${API_BASE_URL}/ping`);
        if (res.ok) {
          dot.className = "w-2 h-2 rounded-full bg-emerald-500 inline-block";
          text.textContent = "Сервер онлайн 🟢";
        }
      } catch (e) {
        dot.className = "w-2 h-2 rounded-full bg-amber-400 inline-block animate-pulse";
        text.textContent = "Сервер просыпается ⏳";
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2400);
    }

    function shareResults() {
      if (!lastQueryInfo) return showToast("⚠️ Сначала выполните поиск");
      const text = `🔍 Запчасть: ${lastQueryInfo.part} на ${lastQueryInfo.carLabel}\nСмотреть: ${window.location.href}`;
      if (window.Telegram?.WebApp?.sendData) {
        window.Telegram.WebApp.sendData(JSON.stringify(lastQueryInfo));
        return;
      }
      window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`, '_blank');
    }

    function resetFilters() {
      document.getElementById('vinInput').value = '';
      document.getElementById('partInput').value = '';
      document.getElementById('vinDecodedCard').classList.add('hidden');
      decodedCar = null;
      document.getElementById('resultsList').innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Форма сброшена</div>`;
      showToast("Сброшено");
    }
  </script>
</body>
</html>
