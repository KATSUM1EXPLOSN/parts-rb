<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Поиск автозапчастей РБ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #f3f4f6);
      color: var(--tg-theme-text-color, #111827);
    }
    .tg-card {
      background-color: var(--tg-theme-secondary-bg-color, #ffffff);
    }
  </style>
</head>
<body class="p-3 pb-24 font-sans text-sm max-w-lg mx-auto">

  <!-- Заголовок -->
  <header class="mb-4">
    <h1 class="text-xl font-bold text-gray-900 tracking-tight">Поиск запчастей РБ 🇧🇾</h1>
    <p class="text-xs text-gray-500">Bamper.by, Motorland, Kufar, Armtek</p>
  </header>

  <!-- Переключатель режима ввода -->
  <div class="flex bg-gray-200 rounded-lg p-1 mb-4">
    <button id="tab-vin" class="w-1/2 py-1.5 text-xs font-semibold rounded-md bg-white shadow-sm transition-all" onclick="switchMode('vin')">По VIN номеру</button>
    <button id="tab-manual" class="w-1/2 py-1.5 text-xs font-semibold rounded-md text-gray-600 transition-all" onclick="switchMode('manual')">Марка / Модель</button>
  </div>

  <!-- Форма поиска -->
  <form id="search-form" onsubmit="handleSearch(event)" class="tg-card p-4 rounded-xl shadow-sm mb-5 space-y-3 border border-gray-100">
    
    <!-- Секция VIN -->
    <div id="section-vin">
      <label class="block text-xs font-medium text-gray-600 mb-1">VIN-код автомобиля</label>
      <input type="text" id="vin-input" maxlength="17" placeholder="Например: VF1..." class="w-full uppercase px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-xs bg-gray-50">
    </div>

    <!-- Секция Марка/Модель/Год -->
    <div id="section-manual" class="hidden space-y-2">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Марка</label>
          <input type="text" id="brand-input" placeholder="Volkswagen, Geely..." class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs bg-gray-50">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Модель</label>
          <input type="text" id="model-input" placeholder="Passat, Atlas..." class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs bg-gray-50">
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Год выпуска</label>
        <input type="number" id="year-input" placeholder="2015" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs bg-gray-50">
      </div>
    </div>

    <!-- Общие поля: Деталь и Город -->
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Название запчасти или OEM</label>
      <input type="text" id="part-input" required placeholder="Фара левая, тормозные диски..." class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs bg-gray-50">
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Город</label>
      <select id="city-input" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs bg-gray-50">
        <option value="Любой">Вся Беларусь</option>
        <option value="Минск" selected>Минск</option>
        <option value="Гродно">Гродно</option>
        <option value="Брест">Брест</option>
        <option value="Гомель">Гомель</option>
        <option value="Витебск">Витебск</option>
        <option value="Могилев">Могилев</option>
      </select>
    </div>

    <button type="submit" id="btn-submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition-colors shadow">
      Найти предложения
    </button>
  </form>

  <!-- Индикатор загрузки -->
  <div id="loader" class="hidden text-center py-8">
    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
    <p class="text-xs text-gray-500 mt-2">Опрашиваем разборки и склады РБ...</p>
  </div>

  <!-- Результаты -->
  <div id="results-container" class="space-y-3"></div>

  <script>
    let currentMode = 'vin';

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    function switchMode(mode) {
      currentMode = mode;
      const tabVin = document.getElementById('tab-vin');
      const tabManual = document.getElementById('tab-manual');
      const secVin = document.getElementById('section-vin');
      const secManual = document.getElementById('section-manual');

      if (mode === 'vin') {
        tabVin.className = "w-1/2 py-1.5 text-xs font-semibold rounded-md bg-white shadow-sm transition-all";
        tabManual.className = "w-1/2 py-1.5 text-xs font-semibold rounded-md text-gray-600 transition-all";
        secVin.classList.remove('hidden');
        secManual.classList.add('hidden');
      } else {
        tabManual.className = "w-1/2 py-1.5 text-xs font-semibold rounded-md bg-white shadow-sm transition-all";
        tabVin.className = "w-1/2 py-1.5 text-xs font-semibold rounded-md text-gray-600 transition-all";
        secManual.classList.remove('hidden');
        secVin.classList.add('hidden');
      }
    }

    async function handleSearch(e) {
      e.preventDefault();
      
      const partName = document.getElementById('part-input').value;
      const city = document.getElementById('city-input').value;
      const vin = document.getElementById('vin-input').value;
      const brand = document.getElementById('brand-input').value;
      const model = document.getElementById('model-input').value;
      const year = document.getElementById('year-input').value;

      const carName = currentMode === 'vin' && vin 
        ? `VIN: ${vin.slice(0, 8)}***` 
        : `${brand || 'Авто'} ${model || ''} ${year || ''}`.trim();

      const loader = document.getElementById('loader');
      const container = document.getElementById('results-container');
      
      loader.classList.remove('hidden');
      container.innerHTML = '';

      // Имитация ответа сервера для статического размещения на GitHub
      setTimeout(() => {
        const items = [
          {
            title: `${partName} (${carName})`,
            price_byn: 120.0,
            condition: "Б/У",
            source: "Bamper.by",
            seller_city: city === "Любой" ? "Минск (Малиновка)" : city,
            image_url: "https://images.unsplash.com/photo-1486006920555-c77dce18193b?w=300&auto=format&fit=crop&q=60",
            source_url: `https://bamper.by/zapchast/${encodeURIComponent(partName)}/`,
            oem_number: "VAG 8K0-121-003"
          },
          {
            title: `${partName} в сборе, отличное сост.`,
            price_byn: 145.0,
            condition: "Б/У",
            source: "Motorland.by",
            seller_city: "Минск (Колядичи)",
            image_url: "https://images.unsplash.com/photo-1517524008697-84bbe3c3fd98?w=300&auto=format&fit=crop&q=60",
            source_url: `https://motorland.by/auto-parts/search/?search_string=${encodeURIComponent(partName)}`,
            oem_number: "VAG 8K0-121-003"
          },
          {
            title: `${partName} (Аналог Stellox / Patron)`,
            price_byn: 85.5,
            condition: "Новый",
            source: "Armtek.by",
            seller_city: "Доставка по РБ (1 день)",
            image_url: "https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?w=300&auto=format&fit=crop&q=60",
            source_url: "https://armtek.by",
            oem_number: "ST-8K0121"
          },
          {
            title: `${partName} оригинал с разборки`,
            price_byn: 95.0,
            condition: "Б/У",
            source: "Kufar Авто",
            seller_city: "Гродно",
            image_url: "https://images.unsplash.com/photo-1486006920555-c77dce18193b?w=300&auto=format&fit=crop&q=60",
            source_url: `https://re.kufar.by/l/auto-goods/parts?query=${encodeURIComponent(partName)}`,
            oem_number: null
          }
        ];

        renderResults(items);
        loader.classList.add('hidden');
      }, 500);
    }

    function renderResults(items) {
      const container = document.getElementById('results-container');
      if (items.length === 0) {
        container.innerHTML = `<p class="text-gray-500 text-center py-6 text-xs">Ничего не найдено</p>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="tg-card p-3 rounded-xl border border-gray-100 shadow-sm flex gap-3">
          <img src="${item.image_url}" class="w-20 h-20 rounded-lg object-cover bg-gray-100 flex-shrink-0" alt="part">
          <div class="flex flex-col justify-between flex-grow min-w-0">
            <div>
              <div class="flex items-center justify-between gap-1 mb-1">
                <span class="text-[10px] px-1.5 py-0.5 rounded font-medium ${item.condition === 'Б/У' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">
                  ${item.condition}
                </span>
                <span class="text-[11px] text-gray-400 truncate">${item.source}</span>
              </div>
              <h3 class="text-xs font-semibold text-gray-800 line-clamp-2">${item.title}</h3>
              ${item.oem_number ? `<p class="text-[10px] text-gray-400 font-mono mt-0.5">${item.oem_number}</p>` : ''}
            </div>
            
            <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-50">
              <div>
                <span class="text-sm font-bold text-gray-900">${item.price_byn} BYN</span>
                <span class="text-[10px] text-gray-400 block">${item.seller_city}</span>
              </div>
              <a href="${item.source_url}" target="_blank" class="px-2.5 py-1 bg-gray-900 hover:bg-black text-white text-xs font-medium rounded-lg">
                Открыть
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
