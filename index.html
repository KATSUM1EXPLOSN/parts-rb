<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PartsRB Pro 🇧🇾 — Агрегатор автозапчастей</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
    }
    body.tg-mode {
      background-color: var(--tg-theme-bg-color, var(--bg-color));
      color: var(--tg-theme-text-color, var(--text-color));
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Скелетон мерцания (Shimmer) */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased flex flex-col items-center">

  <div class="w-full max-w-md min-h-screen flex flex-col bg-white shadow-xl relative border-x border-slate-100">

    <!-- Header с эффектом стекла (Glassmorphism) -->
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-100 px-4 py-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-lg shadow-md text-white font-bold">
            ⚡
          </div>
          <div>
            <h1 class="text-base font-bold leading-tight flex items-center gap-1.5">
              <span>PartsRB Pro</span>
              <span class="text-[9px] bg-red-100 text-red-700 font-bold px-1.5 py-0.5 rounded">РБ 🇧🇾</span>
            </h1>
            <p class="text-[11px] text-slate-500 flex items-center gap-1">
              <span id="backendStatusDot" class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
              <span id="backendStatusText">Каталог Bamper.by активен</span>
            </p>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- Кнопка Избранного -->
          <button onclick="toggleFavoritesView()" id="favToggleBtn" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors relative" title="Избранное">
            <span>❤️</span>
            <span id="favCountBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold px-1 rounded-full hidden">0</span>
          </button>

          <!-- Переключатель валюты -->
          <button id="currencyBtn" onclick="toggleCurrency()" class="px-2.5 py-1 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors flex items-center gap-1">
            <span>BYN</span> 🇧🇾
          </button>
        </div>
      </div>

      <!-- Быстрый Live-поиск -->
      <div class="mt-3 relative">
        <input 
          type="text" 
          id="smartSearchInput" 
          oninput="onSmartSearch(this.value)" 
          placeholder="🔎 Поиск любого авто: 'Passat', 'W124', 'E60', 'Coolray'..." 
          class="w-full px-3.5 py-2 pl-9 bg-slate-100 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium"
        />
        <span class="absolute left-3 top-2.5 text-xs text-slate-400">✨</span>
        <div id="smartResultsBox" class="absolute left-0 right-0 top-10 bg-white border border-slate-200 rounded-xl shadow-xl z-50 hidden max-h-56 overflow-y-auto"></div>
      </div>
    </header>

    <main class="p-4 flex-1 space-y-4">

      <!-- Карусель категорий деталей с Bamper.by -->
      <div>
        <div class="flex justify-between items-center mb-1.5 px-0.5">
          <span class="text-[11px] font-bold text-slate-600 uppercase tracking-wide">Категории узлов</span>
          <span class="text-[10px] text-slate-400">с Bamper.by</span>
        </div>
        <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1" id="categoriesCarousel"></div>
      </div>

      <!-- Блок VIN-декодера -->
      <div class="bg-slate-50 rounded-2xl p-3 border border-slate-200/80 space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-slate-700 flex items-center gap-1">
            <span>🔢</span> Определение по VIN-коду
          </span>
          <span id="vinCounter" class="text-[10px] font-mono text-slate-400">0/17</span>
        </div>
        <div class="relative">
          <input 
            type="text" 
            id="vinInput" 
            maxlength="17" 
            placeholder="Введите VIN (17 знаков)..." 
            oninput="onVinInput(this)" 
            class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl font-mono text-xs uppercase tracking-wider text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <button onclick="pasteVin()" class="absolute right-2 top-1.5 text-[10px] text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md hover:bg-blue-100">Вставить</button>
        </div>
        <div id="vinDecodeBox" class="hidden p-2 bg-emerald-50 border border-emerald-100 rounded-xl text-[11px] text-emerald-800 space-y-0.5">
          <div class="font-bold flex justify-between">
            <span id="vinDecodedMake">Марка авто</span>
            <span id="vinDecodedYear" class="bg-emerald-200 px-1 rounded text-[10px]">Год</span>
          </div>
          <p id="vinDecodedDesc" class="text-emerald-700 text-[10px]">Страна / Сборка определены</p>
        </div>
      </div>

      <!-- Каскадный выбор: Марка -> Модель -> Поколение/Год -->
      <div class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm space-y-3">
        
        <div>
          <label class="text-[11px] font-semibold text-slate-600 mb-1 block">Марка автомобиля</label>
          <select id="brandSelect" onchange="onBrandChange()" class="w-full px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:ring-2 focus:ring-blue-500">
            <option value="">Загрузка марок...</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[11px] font-semibold text-slate-600 mb-1 block">Модель</label>
            <select id="modelSelect" onchange="onModelChange()" disabled class="w-full px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 disabled:opacity-50 focus:ring-2 focus:ring-blue-500">
              <option value="">Сначала марка</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] font-semibold text-slate-600 mb-1 block">Поколение / Год</label>
            <select id="genSelect" disabled class="w-full px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 disabled:opacity-50 focus:ring-2 focus:ring-blue-500">
              <option value="">Сначала модель</option>
            </select>
          </div>
        </div>

        <!-- Поле детали со справочником Bamper.by -->
        <div class="space-y-1.5 pt-1">
          <div class="flex items-center justify-between">
            <label class="text-xs font-semibold text-slate-700">⚙️ Название детали (Каталог Bamper)</label>
            <span id="detectedOemBadge" onclick="copyOemCode()" class="hidden text-[10px] bg-emerald-100 text-emerald-800 font-mono px-1.5 py-0.5 rounded cursor-pointer active:scale-95 transition-transform" title="Нажмите, чтобы скопировать">OEM: 1K0698151 📋</span>
          </div>
          
          <div class="relative">
            <input 
              type="text" 
              id="partInput" 
              list="bamperPartsDatalist"
              placeholder="Фара, бампер передний, суппорт, генератор..." 
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium"
            />
            <!-- Datalist с автоподстановкой всех узлов Bamper.by -->
            <datalist id="bamperPartsDatalist"></datalist>
          </div>
        </div>

      </div>

      <!-- Выбор сайтов для поиска (чекбоксы) -->
      <div class="bg-white rounded-2xl border border-slate-200/80 p-3.5 shadow-sm space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <span>🌐</span> Площадки поиска
          </span>
          <button onclick="toggleAllSources()" class="text-[10px] text-blue-600 hover:underline">Все / Снять</button>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <label class="flex items-center gap-2 p-2 rounded-xl border border-slate-100 hover:bg-slate-50 cursor-pointer">
            <input type="checkbox" id="src_bamper" checked class="rounded text-blue-600 focus:ring-0">
            <div>
              <div class="font-semibold text-slate-800">Bamper.by</div>
              <div class="text-[9px] text-slate-400">Каталог авторазборок</div>
            </div>
          </label>

          <label class="flex items-center gap-2 p-2 rounded-xl border border-slate-100 hover:bg-slate-50 cursor-pointer">
            <input type="checkbox" id="src_kufar" checked class="rounded text-blue-600 focus:ring-0">
            <div>
              <div class="font-semibold text-slate-800">Kufar Авто</div>
              <div class="text-[9px] text-slate-400">Частники и цены в BYN</div>
            </div>
          </label>

          <label class="flex items-center gap-2 p-2 rounded-xl border border-slate-100 hover:bg-slate-50 cursor-pointer">
            <input type="checkbox" id="src_av" checked class="rounded text-blue-600 focus:ring-0">
            <div>
              <div class="font-semibold text-slate-800">av.by Запчасти</div>
              <div class="text-[9px] text-slate-400">Поиск по автопарку</div>
            </div>
          </label>

          <label class="flex items-center gap-2 p-2 rounded-xl border border-slate-100 hover:bg-slate-50 cursor-pointer">
            <input type="checkbox" id="src_motorland" checked class="rounded text-blue-600 focus:ring-0">
            <div>
              <div class="font-semibold text-slate-800">Моторлэнд</div>
              <div class="text-[9px] text-slate-400">Склады РБ с гарантией</div>
            </div>
          </label>

          <label class="flex items-center gap-2 p-2 rounded-xl border border-slate-100 hover:bg-slate-50 cursor-pointer">
            <input type="checkbox" id="src_mg" checked class="rounded text-blue-600 focus:ring-0">
            <div>
              <div class="font-semibold text-slate-800">Mg.by / Armtek</div>
              <div class="text-[9px] text-slate-400">Новые детали и кроссы</div>
            </div>
          </label>

          <label class="flex items-center gap-2 p-2 rounded-xl border border-slate-100 hover:bg-slate-50 cursor-pointer">
            <input type="checkbox" id="src_autoprivoz" checked class="rounded text-blue-600 focus:ring-0">
            <div>
              <div class="font-semibold text-slate-800">Автопривоз</div>
              <div class="text-[9px] text-slate-400">Контрактные детали</div>
            </div>
          </label>
        </div>

        <button 
          onclick="executeSearch()" 
          class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold text-sm rounded-xl shadow-md shadow-blue-500/25 flex items-center justify-center gap-2 transition-all mt-2"
        >
          <span>🚀</span>
          <span>Найти по выбранным сайтам</span>
        </button>
      </div>

      <!-- Лента результатов -->
      <div class="flex items-center justify-between pt-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1" id="resultsTitle">
          <span>📋</span> Карточки поиска
        </h2>
        <span id="resultsCountBadge" class="text-xs bg-slate-200 text-slate-700 font-semibold px-2 py-0.5 rounded-full">
          Готово к поиску
        </span>
      </div>

      <div id="resultsList" class="space-y-2.5">
        <div class="text-center py-8 px-4 bg-white rounded-2xl border border-slate-200/80 text-xs text-slate-400">
          Выберите автомобиль и деталь для подбора
        </div>
      </div>

    </main>

    <!-- Нижняя панель действий -->
    <div class="sticky bottom-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-2.5 flex items-center gap-2">
      <button onclick="shareResults()" class="flex-1 py-2.5 bg-slate-900 hover:bg-black text-white text-xs font-semibold rounded-xl flex items-center justify-center gap-1.5 shadow">
        <span>✈️</span> Отправить выборку в Telegram
      </button>
      <button onclick="resetFilters()" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl" title="Сбросить">
        <span>🔄</span>
      </button>
    </div>

    <!-- Toast-уведомление -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs px-4 py-2 rounded-xl shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none flex items-center gap-1.5">
      <span>🔔</span> <span id="toastText">Сообщение</span>
    </div>

  </div>

  <script>
    const API_BASE_URL = "https://parts-rb-1.onrender.com";
    let ALL_CARS_DATABASE = {};
    let currentCurrency = 'BYN';
    const BYN_PER_USD = 3.28;
    let lastQueryInfo = null;
    let showingFavorites = false;

    // 1. ПОЛНЫЙ КЛАССИФИКАТОР ЗАПЧАСТЕЙ С BAMPER.BY
    const BAMPER_CATEGORIES = [
      {
        name: "Кузовные детали",
        icon: "🛡️",
        items: [
          "Бампер передний", "Бампер задний", "Капот", "Крыло переднее левое", "Крыло переднее правое",
          "Крыло заднее", "Дверь передняя левая", "Дверь передняя правая", "Дверь задняя левая", 
          "Дверь задняя правая", "Крышка багажника", "Решетка радиатора", "Усилитель бампера", "Зеркало боковое"
        ]
      },
      {
        name: "Оптика и свет",
        icon: "💡",
        items: [
          "Фара передняя левая", "Фара передняя правая", "Фонарь задний левый", "Фонарь задний правый",
          "Противотуманная фара (ПТФ)", "Повторитель поворота", "Блок розжига ксенона"
        ]
      },
      {
        name: "Двигатель и навесное",
        icon: "⚙️",
        items: [
          "Двигатель в сборе (ДВС)", "Генератор", "Стартер", "Турбина (Турбокомпрессор)", 
          "Компрессор кондиционера", "ТНВД", "Форсунка топливная", "Дроссельная заслонка",
          "Коллектор впускной", "Коллектор выпускной", "Радиатор охлаждения", "Интеркулер"
        ]
      },
      {
        name: "Ходовая и подвеска",
        icon: "🔩",
        items: [
          "Амортизатор передний", "Амортизатор задний", "Рычаг передний", "Рычаг задний",
          "Подрамник передний", "Балка задняя", "Ступица", "Поворотный кулак", "Пружина подвески", "Стабилизатор"
        ]
      },
      {
        name: "Тормозная система",
        icon: "🛑",
        items: [
          "Суппорт тормозной передний", "Суппорт тормозной задний", "Диск тормозной", "Колодки тормозные",
          "Блок ABS", "Главный тормозной цилиндр", "Вакуумный усилитель"
        ]
      },
      {
        name: "Трансмиссия (КПП)",
        icon: "🕹️",
        items: [
          "Коробка передач (МКПП/АКПП)", "Полуось (Приводной вал)", "Сцепление (комплект)", 
          "Маховик", "Карданный вал", "Редуктор моста", "Раздаточная коробка"
        ]
      },
      {
        name: "Рулевое управление",
        icon: "🎯",
        items: [
          "Рулевая рейка", "Насос ГУР", "Электроусилитель руля (ЭУР)", "Рулевая колонка", "Рулевой наконечник"
        ]
      }
    ];

    // Встроенный словарь WMI для быстрого распознавания VIN
    const WMI_MAP = {
      "WVW": { brand: "Volkswagen", country: "Германия" },
      "WVG": { brand: "Volkswagen", country: "Германия" },
      "Y6D": { brand: "Geely / Belgee", country: "Беларусь (БелДжи)" },
      "LB3": { brand: "Geely", country: "Китай" },
      "VF1": { brand: "Renault", country: "Франция" },
      "WAU": { brand: "Audi", country: "Германия" },
      "WBA": { brand: "BMW", country: "Германия" },
      "WBS": { brand: "BMW M", country: "Германия" },
      "XTA": { brand: "Lada", country: "Россия" },
      "VF3": { brand: "Peugeot", country: "Франция" },
      "VF7": { brand: "Citroen", country: "Франция" }
    };

    window.addEventListener('DOMContentLoaded', async () => {
      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        document.body.classList.add('tg-mode');
      }

      renderCategoriesCarousel();
      populateBamperDatalist();
      updateFavBadge();
      await loadGlobalCarsFromCDN();
    });

    // Тактильный виброотклик Telegram
    function triggerHaptic(type = 'light') {
      try {
        if (window.Telegram?.WebApp?.HapticFeedback) {
          if (type === 'success') window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
          else if (type === 'warning') window.Telegram.WebApp.HapticFeedback.notificationOccurred('warning');
          else window.Telegram.WebApp.HapticFeedback.impactOccurred(type);
        }
      } catch (e) {}
    }

    // Рендер карусели категорий деталей
    function renderCategoriesCarousel() {
      const carousel = document.getElementById('categoriesCarousel');
      carousel.innerHTML = BAMPER_CATEGORIES.map((cat, idx) => `
        <button onclick="selectCategory(${idx})" class="shrink-0 flex items-center gap-1.5 px-3 py-2 bg-slate-100 hover:bg-slate-200 active:scale-95 rounded-xl text-xs font-semibold text-slate-800 transition-all border border-slate-200/60">
          <span>${cat.icon}</span>
          <span>${cat.name}</span>
        </button>
      `).join('');
    }

    function selectCategory(idx) {
      triggerHaptic('light');
      const cat = BAMPER_CATEGORIES[idx];
      // Подставляем первую деталь узла
      document.getElementById('partInput').value = cat.items[0];
      showToast(`Категория: ${cat.name}`);
    }

    // Заполнение Datalist для автодополнения из Bamper.by
    function populateBamperDatalist() {
      const dl = document.getElementById('bamperPartsDatalist');
      const allParts = [];
      BAMPER_CATEGORIES.forEach(c => allParts.push(...c.items));
      dl.innerHTML = allParts.map(p => `<option value="${p}">`).join('');
    }

    // Загрузка мировой базы авто
    async function loadGlobalCarsFromCDN() {
      const statusText = document.getElementById('backendStatusText');
      const statusDot = document.getElementById('backendStatusDot');

      try {
        const res = await fetch('https://raw.githubusercontent.com/matthieua/carrr/master/data/cars.json');
        if (res.ok) {
          const rawList = await res.json();
          processRawCars(rawList);
          statusDot.className = "w-2 h-2 rounded-full bg-emerald-500 inline-block";
          statusText.textContent = `Мировая база: ${Object.keys(ALL_CARS_DATABASE).length} марок 🌍`;
          return;
        }
      } catch (err) {}

      loadFallbackDatabase();
      statusDot.className = "w-2 h-2 rounded-full bg-blue-500 inline-block";
      statusText.textContent = "База РБ и мировые авто активны 🚗";
    }

    function processRawCars(list) {
      ALL_CARS_DATABASE = {};
      list.forEach(item => {
        const b = (item.brand || item.make || '').trim();
        const m = (item.model || '').trim();
        const gen = (item.generation || (item.year ? `${item.year} г.` : 'Все года')).trim();
        if (!b || !m) return;
        if (!ALL_CARS_DATABASE[b]) ALL_CARS_DATABASE[b] = {};
        if (!ALL_CARS_DATABASE[b][m]) ALL_CARS_DATABASE[b][m] = [];
        if (!ALL_CARS_DATABASE[b][m].includes(gen)) ALL_CARS_DATABASE[b][m].push(gen);
      });
      renderBrandsList();
    }

    function loadFallbackDatabase() {
      ALL_CARS_DATABASE = {
        "Volkswagen": {
          "Passat": ["B3 (1988-1993)", "B4 (1993-1997)", "B5 (1996-2005)", "B6 (2005-2010)", "B7 (2010-2015)", "B8 (2014-2020)"],
          "Golf": ["Golf 3 (1991-1998)", "Golf 4 (1997-2004)", "Golf 5 (2003-2008)", "Golf 6 (2008-2012)", "Golf 7 (2012-2019)"],
          "Polo": ["Polo Sedan (2010-2020)", "Polo 5 (2009-2017)", "Polo 6 (2017+)"],
          "Tiguan": ["1 пок. (2007-2016)", "2 пок. (2016-2023)"]
        },
        "Geely / Belgee": {
          "Coolray / Belgee X50": ["SX11 (2020-2024)", "Рестайлинг (2024+)"],
          "Atlas": ["NL-3 (2017-2021)", "Atlas Pro (2021-2024)"],
          "Emgrand": ["Emgrand 7 (2016-2021)", "New Emgrand (2022+)"],
          "Monjaro": ["2022-2024"],
          "Tugella": ["2020-2024"]
        },
        "Renault": {
          "Megane": ["Megane 1 (1995-2002)", "Megane 2 (2002-2008)", "Megane 3 (2008-2016)", "Megane 4 (2016-2022)"],
          "Duster": ["1 пок. (2010-2015)", "1 пок. Рестайл (2015-2021)", "2 пок. (2021+)"],
          "Scenic": ["Scenic 1 (1996-2003)", "Scenic 2 (2003-2009)", "Scenic 3 (2009-2016)"],
          "Laguna": ["Laguna 1 (1993-2001)", "Laguna 2 (2001-2007)", "Laguna 3 (2007-2015)"]
        },
        "BMW": {
          "3-Series": ["E36 (1990-2000)", "E46 (1998-2006)", "E90 (2005-2013)", "F30 (2011-2019)", "G20 (2019+)"],
          "5-Series": ["E34 (1987-1996)", "E39 (1995-2003)", "E60 (2003-2010)", "F10 (2010-2017)", "G30 (2017+)"],
          "X5": ["E53 (1999-2006)", "E70 (2006-2013)", "F15 (2013-2018)", "G05 (2018+)"]
        },
        "Audi": {
          "A6": ["C4 (1994-1997)", "C5 (1997-2004)", "C6 (2004-2011)", "C7 (2011-2018)", "C8 (2018+)"],
          "A4": ["B5 (1994-2001)", "B6 (2000-2004)", "B7 (2004-2008)", "B8 (2007-2015)", "B9 (2015+)"]
        }
      };
      renderBrandsList();
    }

    function renderBrandsList() {
      const brandSel = document.getElementById('brandSelect');
      brandSel.innerHTML = '<option value="">Выберите марку...</option>';
      Object.keys(ALL_CARS_DATABASE).sort().forEach(brand => {
        const opt = document.createElement('option');
        opt.value = brand;
        opt.textContent = `🚗 ${brand}`;
        brandSel.appendChild(opt);
      });
    }

    function onBrandChange() {
      triggerHaptic('light');
      const brand = document.getElementById('brandSelect').value;
      const modelSel = document.getElementById('modelSelect');
      const genSel = document.getElementById('genSelect');

      modelSel.innerHTML = '<option value="">Выберите модель...</option>';
      genSel.innerHTML = '<option value="">Сначала модель</option>';
      genSel.disabled = true;

      if (!brand || !ALL_CARS_DATABASE[brand]) {
        modelSel.disabled = true;
        return;
      }

      modelSel.disabled = false;
      Object.keys(ALL_CARS_DATABASE[brand]).sort().forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        modelSel.appendChild(opt);
      });
    }

    function onModelChange() {
      triggerHaptic('light');
      const brand = document.getElementById('brandSelect').value;
      const model = document.getElementById('modelSelect').value;
      const genSel = document.getElementById('genSelect');

      genSel.innerHTML = '<option value="">Выберите поколение/год...</option>';
      if (!model || !ALL_CARS_DATABASE[brand]?.[model]) {
        genSel.disabled = true;
        return;
      }

      genSel.disabled = false;
      ALL_CARS_DATABASE[brand][model].forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.textContent = g;
        genSel.appendChild(opt);
      });
    }

    // Умный мгновенный поиск
    function onSmartSearch(val) {
      const box = document.getElementById('smartResultsBox');
      const q = val.trim().toLowerCase();
      if (q.length < 2) {
        box.classList.add('hidden');
        return;
      }

      const matches = [];
      for (const brand in ALL_CARS_DATABASE) {
        for (const model in ALL_CARS_DATABASE[brand]) {
          if (`${brand} ${model}`.toLowerCase().includes(q)) {
            matches.push({ brand, model, gens: ALL_CARS_DATABASE[brand][model] });
            if (matches.length >= 8) break;
          }
        }
        if (matches.length >= 8) break;
      }

      if (matches.length === 0) {
        box.classList.add('hidden');
        return;
      }

      box.classList.remove('hidden');
      box.innerHTML = matches.map(item => `
        <div onclick="applySmartMatch('${item.brand}', '${item.model}')" class="p-2.5 hover:bg-slate-50 cursor-pointer border-b border-slate-100 last:border-none flex items-center justify-between">
          <div>
            <div class="text-xs font-semibold text-slate-800">${item.brand} ${item.model}</div>
            <div class="text-[10px] text-slate-400">Поколений: ${item.gens.length}</div>
          </div>
          <span class="text-blue-600 text-xs font-semibold">Выбрать &rarr;</span>
        </div>
      `).join('');
    }

    function applySmartMatch(brand, model) {
      triggerHaptic('medium');
      document.getElementById('brandSelect').value = brand;
      onBrandChange();
      document.getElementById('modelSelect').value = model;
      onModelChange();
      document.getElementById('smartResultsBox').classList.add('hidden');
      document.getElementById('smartSearchInput').value = '';
      showToast(`Выбрано: ${brand} ${model}`);
    }

    // Декодирование VIN
    function onVinInput(input) {
      let val = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      input.value = val;
      document.getElementById('vinCounter').textContent = `${val.length}/17`;

      const box = document.getElementById('vinDecodeBox');
      if (val.length >= 3) {
        const hit = WMI_MAP[val.substring(0, 3)];
        if (hit) {
          triggerHaptic('success');
          box.classList.remove('hidden');
          document.getElementById('vinDecodedMake').textContent = hit.brand;
          document.getElementById('vinDecodedYear').textContent = hit.country;
          document.getElementById('vinDecodedDesc').textContent = `Страна сборки: ${hit.country}.`;

          if (document.getElementById('brandSelect').value !== hit.brand && ALL_CARS_DATABASE[hit.brand]) {
            document.getElementById('brandSelect').value = hit.brand;
            onBrandChange();
          }
          return;
        }
      }
      if (val.length < 3) box.classList.add('hidden');
    }

    async function pasteVin() {
      triggerHaptic('light');
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          const input = document.getElementById('vinInput');
          input.value = text.trim().substring(0, 17);
          onVinInput(input);
        }
      } catch (e) {
        showToast("Введите VIN вручную");
      }
    }

    function setPartTag(tag) {
      triggerHaptic('light');
      document.getElementById('partInput').value = tag;
    }

    function copyOemCode() {
      triggerHaptic('success');
      navigator.clipboard.writeText("1K0698151");
      showToast("📋 Артикул скопирован в буфер!");
    }

    function makeSlug(text) {
      const ru = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ы':'y','э':'e','ю':'yu','я':'ya',' ':'-'};
      return text.toLowerCase().split('').map(c => ru[c] || (/[a-z0-9]/.test(c) ? c : '-')).join('').replace(/-+/g, '-').replace(/^-|-$/g, '');
    }

    function toggleAllSources() {
      triggerHaptic('light');
      const ids = ['src_kufar', 'src_bamper', 'src_av', 'src_motorland', 'src_mg', 'src_autoprivoz'];
      const anyUnchecked = ids.some(id => !document.getElementById(id).checked);
      ids.forEach(id => document.getElementById(id).checked = anyUnchecked);
      showToast(anyUnchecked ? "Все сайты выбраны" : "Выбор снят");
    }

    // 2. СИСТЕМА ИЗБРАННОГО (ЗАКЛАДКИ)
    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem('partsrb_favs') || '[]');
      } catch (e) {
        return [];
      }
    }

    function toggleFavorite(id, title, price, url, source, car) {
      triggerHaptic('medium');
      let favs = getFavorites();
      const existsIndex = favs.findIndex(f => f.id === id);

      if (existsIndex >= 0) {
        favs.splice(existsIndex, 1);
        showToast("Удалено из избранного");
      } else {
        favs.push({ id, title, price, url, source, car });
        showToast("❤️ Добавлено в избранное!");
      }

      localStorage.setItem('partsrb_favs', JSON.stringify(favs));
      updateFavBadge();

      if (showingFavorites) {
        renderFavorites();
      } else {
        updateHeartIcons();
      }
    }

    function updateFavBadge() {
      const favs = getFavorites();
      const badge = document.getElementById('favCountBadge');
      if (favs.length > 0) {
        badge.textContent = favs.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function updateHeartIcons() {
      const favs = getFavorites();
      document.querySelectorAll('.fav-btn').forEach(btn => {
        const id = btn.getAttribute('data-id');
        const isFav = favs.some(f => f.id === id);
        btn.innerHTML = isFav ? '❤️' : '🤍';
      });
    }

    function toggleFavoritesView() {
      triggerHaptic('medium');
      showingFavorites = !showingFavorites;
      const title = document.getElementById('resultsTitle');

      if (showingFavorites) {
        title.innerHTML = `<span>❤️</span> Избранные запчасти`;
        renderFavorites();
      } else {
        title.innerHTML = `<span>📋</span> Карточки поиска`;
        if (lastQueryInfo) executeSearch();
        else document.getElementById('resultsList').innerHTML = `<div class="text-center py-8 text-xs text-slate-400">Выберите авто и деталь</div>`;
      }
    }

    function renderFavorites() {
      const favs = getFavorites();
      const container = document.getElementById('resultsList');
      document.getElementById('resultsCountBadge').textContent = `В закладках: ${favs.length}`;

      if (favs.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-slate-400">У вас пока нет сохранённых запчастей 🤍</div>`;
        return;
      }

      container.innerHTML = favs.map(item => `
        <div class="bg-white rounded-2xl border border-slate-200/90 p-3.5 shadow-sm space-y-2">
          <div class="flex items-start justify-between gap-2">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-100 text-amber-800">Б/У</span>
            <div class="flex items-center gap-2">
              <span class="price-tag text-sm font-bold text-slate-900" data-byn="${item.price}">${item.price} BYN</span>
              <button onclick="toggleFavorite('${item.id}')" class="text-sm">❤️</button>
            </div>
          </div>
          <h3 class="text-xs font-semibold text-slate-800 leading-snug">📦 ${item.title}</h3>
          <p class="text-[11px] text-slate-500">🚘 ${item.car} &bull; 🏪 ${item.source}</p>
          <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px]">
            <span class="text-slate-400">📍 Европочта: ~5-10 BYN</span>
            <a href="${item.url}" target="_blank" class="px-3 py-1 bg-blue-600 text-white font-medium text-xs rounded-lg">Открыть ↗</a>
          </div>
        </div>
      `).join('');
      updateRenderedPrices();
    }

    // 3. ЗАПУСК ПОИСКА И СКЕЛЕТОНЫ ЗАГРУЗКИ
    async function executeSearch() {
      triggerHaptic('heavy');
      showingFavorites = false;

      const part = document.getElementById('partInput').value.trim();
      const brand = document.getElementById('brandSelect').value;
      const model = document.getElementById('modelSelect').value;
      const gen = document.getElementById('genSelect').value;

      if (!part) {
        triggerHaptic('warning');
        return showToast("⚠️ Укажите запчасть");
      }
      if (!brand || !model) {
        triggerHaptic('warning');
        return showToast("⚠️ Выберите марку и модель");
      }

      const carLabel = `${brand} ${model} ${gen || ''}`.trim();
      lastQueryInfo = { carLabel, part };

      const container = document.getElementById('resultsList');
      
      // Рендер скелетона мерцания (Skeleton Shimmer)
      container.innerHTML = [1, 2, 3].map(() => `
        <div class="bg-white rounded-2xl border border-slate-200 p-3.5 shadow-sm space-y-2.5">
          <div class="flex justify-between items-center">
            <div class="h-4 w-16 skeleton rounded-md"></div>
            <div class="h-4 w-20 skeleton rounded-md"></div>
          </div>
          <div class="h-3 w-3/4 skeleton rounded-md"></div>
          <div class="h-3 w-1/2 skeleton rounded-md"></div>
          <div class="pt-2 flex justify-between items-center border-t border-slate-100">
            <div class="h-3 w-24 skeleton rounded-md"></div>
            <div class="h-6 w-16 skeleton rounded-lg"></div>
          </div>
        </div>
      `).join('');

      // Запрос к Kufar через бэкенд
      let kufarAds = [];
      if (document.getElementById('src_kufar').checked) {
        try {
          const resp = await fetch(`${API_BASE_URL}/api/search`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ car: `${brand} ${model}`, part })
          });
          if (resp.ok) {
            const data = await resp.json();
            kufarAds = data.filter(item => item.source.includes("Kufar"));
          }
        } catch (e) {}
      }

      // Генерация точных целевых карточек с Bamper.by слагами
      const fullQ = encodeURIComponent(`${brand} ${model} ${part}`);
      const partSlug = makeSlug(part);
      const items = [...kufarAds];

      if (document.getElementById('src_bamper').checked) {
        items.push({
          id: `bamper_${partSlug}`,
          title: `Разборки Bamper.by: ${part} (${brand} ${model})`,
          car: carLabel,
          condition: "Б/У",
          source: "Bamper.by",
          sourceUrl: `https://bamper.by/search/zapchast_${partSlug}/`,
          city: "Минск / Разборки РБ",
          priceByn: 140.0
        });
      }

      if (document.getElementById('src_av').checked) {
        items.push({
          id: `av_${fullQ}`,
          title: `Каталог av.by: ${part}`,
          car: carLabel,
          condition: "Б/У",
          source: "av.by Запчасти",
          sourceUrl: `https://zapchasti.av.by/search?query=${fullQ}`,
          city: "Вся Беларусь",
          priceByn: 125.0
        });
      }

      if (document.getElementById('src_motorland').checked) {
        items.push({
          id: `motor_${fullQ}`,
          title: `Склад Motorland: ${part} (гарантия 14 дней)`,
          car: carLabel,
          condition: "Б/У",
          source: "Motorland.by",
          sourceUrl: `https://motorland.by/auto-parts/?search_string=${fullQ}`,
          city: "Минск (Колядичи)",
          priceByn: 160.0
        });
      }

      if (document.getElementById('src_autoprivoz').checked) {
        items.push({
          id: `privoz_${fullQ}`,
          title: `Автопривоз склад: ${part}`,
          car: carLabel,
          condition: "Б/У",
          source: "autoprivoz.by",
          sourceUrl: `https://autoprivoz.by/search/?q=${fullQ}`,
          city: "Склады РБ",
          priceByn: 135.0
        });
      }

      if (document.getElementById('src_mg').checked) {
        items.push({
          id: `mg_${fullQ}`,
          title: `Склады Mg.by / Armtek: новый ${part}`,
          car: carLabel,
          condition: "Новый",
          source: "Mg.by / Armtek",
          sourceUrl: `https://mg.by/Search?Query=${encodeURIComponent(part)}`,
          city: "Доставка 24ч",
          priceByn: 85.0
        });
      }

      renderCards(items);
      triggerHaptic('success');
      showToast(`Найдено предложений: ${items.length}`);
    }

    function renderCards(items) {
      const container = document.getElementById('resultsList');
      document.getElementById('resultsCountBadge').textContent = `Найдено: ${items.length} 🎯`;

      if (!items || items.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Ни одной площадки не выбрано</div>`;
        return;
      }

      const favs = getFavorites();

      container.innerHTML = items.map(item => {
        const isFav = favs.some(f => f.id === item.id);
        return `
          <div class="bg-white rounded-2xl border border-slate-200/90 p-3.5 shadow-sm space-y-2 transition-all hover:border-blue-300">
            <div class="flex items-start justify-between gap-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${item.condition === 'Б/У' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">
                ${item.condition}
              </span>
              <div class="flex items-center gap-2">
                <span class="price-tag text-sm font-bold text-slate-900" data-byn="${item.priceByn}">${item.priceByn} BYN</span>
                <button onclick="toggleFavorite('${item.id}', '${item.title}', ${item.priceByn}, '${item.sourceUrl}', '${item.source}', '${item.car}')" class="fav-btn text-sm active:scale-125 transition-transform" data-id="${item.id}">
                  ${isFav ? '❤️' : '🤍'}
                </button>
              </div>
            </div>
            <h3 class="text-xs font-semibold text-slate-800 leading-snug">📦 ${item.title}</h3>
            <p class="text-[11px] text-slate-500">🚘 ${item.car} &bull; 🏪 ${item.source}</p>
            <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px]">
              <div>
                <span class="text-slate-500 block">📍 ${item.city}</span>
                <span class="text-[9px] text-slate-400 font-medium">📦 Доставка по РБ: ~5-12 BYN</span>
              </div>
              <a href="${item.sourceUrl}" target="_blank" rel="noopener noreferrer" onclick="triggerHaptic('light')" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs rounded-lg flex items-center gap-1 shadow-sm transition-colors">
                <span>Открыть</span> <span>↗</span>
              </a>
            </div>
          </div>
        `;
      }).join('');
      updateRenderedPrices();
    }

    function toggleCurrency() {
      triggerHaptic('light');
      currentCurrency = currentCurrency === 'BYN' ? 'USD' : 'BYN';
      document.getElementById('currencyBtn').innerHTML = currentCurrency === 'BYN' ? '<span>BYN</span> 🇧🇾' : '<span>USD</span> 💵';
      updateRenderedPrices();
      showToast(`Валюта: ${currentCurrency}`);
    }

    function updateRenderedPrices() {
      document.querySelectorAll('.price-tag').forEach(el => {
        const byn = parseFloat(el.getAttribute('data-byn'));
        if (!isNaN(byn)) {
          el.textContent = currentCurrency === 'BYN' ? `${byn} BYN` : `$${Math.round(byn / BYN_PER_USD)}`;
        }
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2200);
    }

    function shareResults() {
      triggerHaptic('medium');
      if (!lastQueryInfo) return showToast("⚠️ Сначала выполните поиск");
      const text = `🔍 Поиск запчасти: ${lastQueryInfo.part} на ${lastQueryInfo.carLabel}\nСсылка: ${window.location.href}`;
      if (window.Telegram?.WebApp?.sendData) {
        window.Telegram.WebApp.sendData(JSON.stringify(lastQueryInfo));
        return;
      }
      window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`, '_blank');
    }

    function resetFilters() {
      triggerHaptic('medium');
      document.getElementById('partInput').value = '';
      document.getElementById('vinInput').value = '';
      document.getElementById('vinDecodeBox').classList.add('hidden');
      document.getElementById('resultsList').innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Форма сброшена</div>`;
      showToast("Сброшено");
    }
  </script>
</body>
